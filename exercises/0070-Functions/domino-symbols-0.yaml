title: "Drawing Symbols with Switch"
descriptionMd: |
  # Drawing Symbols with Switch

  ![Symbol](https://raw.githubusercontent.com/rstropek/ts-web-playground/refs/heads/main/exercises/0070-Functions/domino-symbols-0.png)
  
  ## Introduction

  In this exercise, you will learn how to use a **switch statement** to draw different symbols based on a random number. This is a great way to handle multiple conditions where you check the same variable against different values.

  ## Starter Code

  The starter code creates a black square (200x200 pixels) on a light gray background. It generates a random number between 1 and 6 and stores it in the variable `symbol`.

  ## Your Task

  Use a **switch statement** to draw different symbols based on the value of `symbol`:

  1. **Square** (□) - Use `rect()` with `rectMode(CENTER)`. Set fill to white, add a white stroke with `strokeWeight(2)`.
  2. **Circle** (○) - Use `circle()` with white fill.
  3. **Triangle** (△) - Use `triangle()` with white fill and a white stroke with `strokeWeight(2)`.
  4. **Star** - Use `text("⭐", centerX, centerY)` with `textAlign(CENTER, CENTER)` and `textSize(size)`.
  5. **Heart** - Use `text("❤️", centerX, centerY)` with `textAlign(CENTER, CENTER)` and `textSize(size)`.
  6. **Lucky Charm** - Use `text("🍀", centerX, centerY)` with `textAlign(CENTER, CENTER)` and `textSize(size)`.

  The variables `centerX`, `centerY`, and `size` are already defined for you. Each symbol should be centered in the square.

  ## Hints

  - A switch statement looks like this:
    ```typescript
    switch (variable) {
      case value1:
        // code for value1
        break;
      case value2:
        // code for value2
        break;
    }
    ```
  - Don't forget the `break` statement after each case!
  - For the square, remember to reset `rectMode(CORNER)` after drawing, and call `noStroke()` to remove the stroke for subsequent drawings.
  - For the triangle, the three points should form a triangle centered at `(centerX, centerY)` with a height/width of `size`.

